services:
  hermes:
    build: .
    container_name: hermes-sandbox
    ports:
      # Loopback-only on the host — ngrok runs on the host and tunnels this
      # to ElevenLabs; nothing else needs to reach it, so no reason to bind
      # 0.0.0.0 on the host side. (The container-side bind is 0.0.0.0 per
      # API_SERVER_HOST in .env, since Docker's forwarded traffic doesn't
      # arrive as true loopback inside the container.)
      - "127.0.0.1:8642:8642"
    volumes:
      # The one and only mount: this is the architecture plan's "/data" —
      # Hermes's ~/.hermes (config/memory/skills), the Google OAuth token,
      # conversation/session state, and the reminder-scheduler SQLite.
      # Bind-mounted to a sibling directory (../conductor-data/hermes), not
      # a Docker-managed named volume: a named volume lives inside Docker
      # Desktop's VM (/var/lib/docker/volumes/...), invisible to normal
      # host backups, and was found to hold real unbacked-up data (session
      # history, the OAuth token, hand-tuned config) with no copy anywhere
      # else. Deliberately a *sibling* of this repo, not a subdirectory of
      # it, even gitignored: `git clean -fdx` would delete a gitignored
      # subdirectory without hesitation. This is still not the "no bind
      # mounts of host directories" case the original comment (see git
      # history) warned against — that was about not exposing the *user's*
      # personal folders (Documents, iCloud Drive) to the sandboxed agent;
      # this directory holds only Hermes's own state, identical in content
      # and exposure to what the named volume held, just relocated so a
      # human can see and back it up.
      - ../conductor-data/hermes:/home/hermes/.hermes
    environment:
      # oMLX doesn't require auth, but Hermes's OpenAI-compatible client
      # expects a non-empty key.
      - OPENAI_API_KEY=local-omlx-no-key-required
    extra_hosts:
      # host.docker.internal is native on Docker Desktop for Mac; this entry
      # is a no-op there but keeps the compose file portable to Linux hosts.
      - "host.docker.internal:host-gateway"
    sysctls:
      # Docker Desktop's default bridge network answers AAAA queries for
      # external hosts but has no real IPv6 egress — clients that prefer
      # IPv6 (Hermes's Telegram adapter included) hang instead of falling
      # back to IPv4 quickly. Disabling IPv6 in the container forces IPv4
      # for all outbound connections (Telegram, and later Twilio/ElevenLabs).
      - net.ipv6.conf.all.disable_ipv6=1
    stdin_open: true
    tty: true
